[build]
target = "thumbv8m.main-none-eabihf"

# The runners need target/libicount.so, which `make test-qemu` builds, see icount.c
[target.thumbv8m.main-none-eabihf]
runner = "qemu-system-arm -machine mps2-an505 -cpu cortex-m33 -nographic -semihosting-config enable=on,target=native -plugin target/libicount.so -kernel"
rustflags = ["-C", "link-arg=-Tlink.x", "-C", "target-cpu=cortex-m33"]

[target.thumbv7em-none-eabihf]
runner = "qemu-system-arm -machine mps2-an386 -cpu cortex-m4 -nographic -semihosting-config enable=on,target=native -plugin target/libicount.so -kernel"
rustflags = ["-C", "link-arg=-Tlink.x"]
